# Distrobox assemble manifest for the toolbx-containers images.
#
# Usage:
#   distrobox assemble create          # uses ./distrobox.ini by default
#   distrobox enter fedora-toolbox
#
# Upgrade packages inside existing containers (dnf/apt; not an image refresh):
#   distrobox upgrade --all
#
# Refresh to a newly published image (pull=true, then recreate):
#   distrobox assemble create --replace
#
# Remove containers defined here:
#   distrobox assemble rm
#
# Desktop icons: entries in exported_apps are exported to the host application
# menu when the container is created (via distrobox-export). To export or
# remove apps later, run inside the container:
#   distrobox-export --app <name>
#   distrobox-export --app <name> --delete
#
# Binaries can be exported to ~/.local/bin the same way:
#   distrobox-export --bin /usr/bin/<bin> --export-path ~/.local/bin
#
# Image tags mirror .fedora-version / .ubuntu-version.

[fedora-toolbox]
image=ghcr.io/tankdonut/fedora-toolbox:44
pull=true
start_now=false
exported_apps="librewolf codium"

[ubuntu-toolbox]
image=ghcr.io/tankdonut/ubuntu-toolbox:24.04
pull=true
start_now=false
exported_apps="codium"
